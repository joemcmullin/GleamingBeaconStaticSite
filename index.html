<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Gleaming Beacon™ — Guidance that stays yours</title>
    <meta name="description" content="A premium personal life-alignment app that unites astronomy, numerology, feng shui and Eastern traditions — computed entirely on your device. Your birth, home and family data never leaves your phone. Coming soon to iOS &amp; Android." />
    <meta name="theme-color" content="#ECECEE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1B1E" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gleaming Beacon™ — Guidance that stays yours" />
    <meta property="og:description" content="Astronomy, numerology, feng shui and Eastern traditions in one calm, private almanac — computed entirely on-device. Coming soon to iOS &amp; Android." />
    <meta property="og:url" content="https://gleamingbeacon.com/" />
    <meta property="og:image" content="https://gleamingbeacon.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gleaming Beacon™ — Guidance that stays yours" />
    <meta name="twitter:description" content="A private-by-design personal life-alignment app. Coming soon to iOS &amp; Android." />
    <meta name="twitter:image" content="https://gleamingbeacon.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      // Theme init before paint — avoids flash of wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('gb-theme');
          var mode = stored || 'light'; // default light per brief
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          // Mark JS-enabled so the reveal animation's hidden base state only
          // applies when it can actually be un-hidden.
          document.documentElement.classList.add('js');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
