<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Gleaming Beacon™ — A Personal Life Alignment Platform</title>
    <meta name="description" content="A premium personal life-alignment app that unites astronomy, numerology, feng shui and Eastern traditions — computed entirely on your device. Your birth, home and family data never leaves your phone. Coming soon to iOS &amp; Android." />
    <meta name="theme-color" content="#ECECEE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1B1E" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gleaming Beacon™ — A Personal Life Alignment Platform" />
    <meta property="og:description" content="Astronomy, numerology, feng shui and Eastern traditions in one calm, private almanac — computed entirely on-device. Coming soon to iOS &amp; Android." />
    <meta property="og:url" content="https://gleamingbeacon.com/" />
    <meta property="og:image" content="https://gleamingbeacon.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gleaming Beacon™ — A Personal Life Alignment Platform" />
    <meta name="twitter:description" content="A private-by-design personal life-alignment app. Coming soon to iOS &amp; Android." />
    <meta name="twitter:image" content="https://gleamingbeacon.com/og-image.png" />

    <!-- Structured data: ties the app to its publisher, Apex Development Studio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Gleaming Beacon",
        "url": "https://gleamingbeacon.com/",
        "operatingSystem": "iOS, Android",
        "applicationCategory": "LifestyleApplication",
        "description": "A premium personal life-alignment app that unites astronomy, numerology, feng shui and Eastern traditions, computed entirely on your device. Your birth, home and family data never leaves your phone.",
        "publisher": {
          "@type": "Organization",
          "@id": "https://apexdevelopmentstudio.com/#org",
          "name": "Apex Development Studio LLC",
          "url": "https://apexdevelopmentstudio.com/"
        }
      }
    </script>

    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script>
      // GitHub Pages SPA deep-link support: 404.html redirects /privacy →
      // /?/privacy; this restores the clean path before the app boots.
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
    <script>
      // Theme init before paint — avoids flash of wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('gb-theme');
          var mode = stored || 'light'; // default light per brief
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          // Mark JS-enabled so the reveal animation's hidden base state only
          // applies when it can actually be un-hidden.
          document.documentElement.classList.add('js');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
