<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gleaming Beacon</title>
    <script>
      // GitHub Pages single-page-app redirect. Rewrites an unknown deep link
      // (e.g. /privacy) into /?/privacy and hands it to index.html, which decodes
      // it back to the clean path. Keeps client-side routes working on refresh /
      // direct navigation. (pathSegmentsToKeep = 0 for an apex custom domain.)
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
